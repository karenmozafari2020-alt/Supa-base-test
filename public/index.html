<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Karen Messenger V4.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef2f7;color:#17212b}button,input,textarea{font:inherit}button{border:0;cursor:pointer}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#e8f5ff,#f2edff)}.card{width:min(410px,100%);background:#fff;padding:26px;border-radius:26px;box-shadow:0 15px 55px #0002}.logo{width:76px;height:76px;margin:auto;border-radius:24px;display:grid;place-items:center;background:#635bdb;color:#fff;font-size:34px;font-weight:bold}.card h1{text-align:center;margin:14px 0 4px}.muted{text-align:center;color:#87929e}
.tabs{display:flex;gap:4px;background:#f0f2f5;padding:4px;border-radius:14px;margin:18px 0 10px}.tabs button{flex:1;padding:11px;background:transparent;border-radius:11px}.tabs .active{background:#fff;box-shadow:0 2px 9px #0001}
input,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #dce2e9;border-radius:14px;outline:0}.primary{width:100%;padding:14px;border-radius:14px;background:#6257e7;color:#fff;font-weight:bold;margin-top:8px}.err{text-align:center;color:#d34c5b;min-height:23px;padding-top:5px}
.app{height:100vh;display:flex;overflow:hidden}.side{width:350px;background:#fff;border-left:1px solid #dde2e8;display:flex;flex-direction:column}.top{padding:15px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800}.me{font-size:12px;color:#8b96a1}.icon{background:#f0f2f6;border-radius:12px;padding:9px}.search{padding:0 14px 12px}.search input{margin:0;background:#f3f5f7;border:0}.list{overflow:auto;flex:1}.user{width:100%;display:flex;align-items:center;gap:11px;padding:12px 15px;background:#fff;text-align:right}.user:hover,.user.sel{background:#f1f2ff}.avatar{width:48px;height:48px;border-radius:50%;background:#e1e5ff;color:#5d52d9;display:grid;place-items:center;font-weight:bold;flex:none;background-size:cover;background-position:center}.info{flex:1;min-width:0}.name{font-weight:bold}.status{font-size:11px;color:#929ca7}.online{color:#1aa66b}.logout{margin:10px 14px 14px;padding:11px;border-radius:12px;background:#f0f2f4}
.chat{flex:1;display:flex;flex-direction:column;background:#edf1f5}.head{height:70px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 17px;border-bottom:1px solid #dde2e8}.headinfo{flex:1}.headname{font-weight:bold}.headstatus{font-size:11px;color:#89949f}.back{display:none;background:#f0f2f6;padding:9px;border-radius:11px}
.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}.empty{margin:auto;color:#8b96a1;text-align:center}.bubble{max-width:min(76%,570px);padding:10px 13px;border-radius:17px;background:#fff;box-shadow:0 2px 8px #00000008;align-self:flex-start}.mine{align-self:flex-end;background:#6257e7;color:#fff;border-bottom-right-radius:5px}.bubble:not(.mine){border-bottom-left-radius:5px}.photo{max-width:260px;max-height:350px;border-radius:14px;display:block}.audio{width:245px;max-width:100%;display:block}.meta{font-size:10px;opacity:.65;margin-top:4px}.reactions{display:flex;gap:3px;margin-top:4px}.reactions span{background:#ffffff44;padding:2px 6px;border-radius:10px;font-size:11px}
.composer{background:#fff;padding:10px;display:flex;gap:7px}.composer input{margin:0}.send{width:54px;background:#6257e7;color:#fff;border-radius:15px}.recording{background:#e74c5c!important;color:#fff}
.menu,.reacts{position:fixed;z-index:50;background:#fff;box-shadow:0 9px 35px #0003;border-radius:15px}.menu{overflow:hidden}.menu button{width:160px;display:block;background:#fff;text-align:right;padding:12px}.reacts{padding:7px;display:flex;gap:5px}.reacts button{padding:7px;border-radius:12px;background:#f1f3f6;font-size:18px}
.modalback{position:fixed;inset:0;background:#0006;z-index:40;display:none;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#fff;border-radius:24px;padding:22px}.close{float:left;padding:8px;border-radius:10px;background:#f0f2f6}.big{width:90px;height:90px;margin:8px auto 14px;border-radius:50%;background:#e1e5ff;display:grid;place-items:center;font-size:30px;font-weight:bold;color:#6257e7;background-size:cover;background-position:center}
@media(max-width:720px){.side{width:100%}.chat{display:none}.app.open .side{display:none}.app.open .chat{display:flex}.back{display:block}}
</style></head><body>
<div id="auth" class="auth"><div class="card"><div class="logo">K</div><h1>Karen Messenger</h1><div class="muted">V4.0 — چت مشترک واقعی</div><div class="tabs"><button id="login" class="active" type="button">ورود</button><button id="register" type="button">ثبت‌نام</button></div><input id="user" placeholder="نام کاربری"><input id="pass" type="password" placeholder="رمز عبور"><button id="authBtn" class="primary" type="button">ورود</button><div id="error" class="err"></div></div></div>

<div id="app" class="app" style="display:none"><aside class="side"><div class="top"><div><div class="brand">Karen Messenger</div><div id="myname" class="me"></div></div><button id="profileBtn" class="icon" type="button">👤</button></div><div class="search"><input id="search" placeholder="جستجوی کاربر"></div><div id="users" class="list"></div><button id="logout" class="logout" type="button">خروج</button></aside>
<main class="chat"><div class="head"><button id="back" class="back" type="button">→</button><div id="headAvatar" class="avatar">?</div><div class="headinfo"><div id="headName" class="headname">مخاطب را انتخاب کن</div><div id="headStatus" class="headstatus"></div></div></div><div id="messages" class="messages"><div class="empty">یک نفر را از لیست انتخاب کن 💬</div></div><div class="composer"><button id="voice" class="icon" type="button" disabled>🎙️</button><button id="gallery" class="icon" type="button" disabled>🖼️</button><input id="file" type="file" accept="image/*" hidden><input id="text" placeholder="پیام..." disabled><button id="send" class="send" type="button" disabled>➤</button></div></main></div>

<div id="menu" class="menu" style="display:none"><button id="copy" type="button">📋 کپی</button><button id="forward" type="button">↗️ فوروارد</button><button id="react" type="button">😊 واکنش</button></div>
<div id="reacts" class="reacts" style="display:none"><button data-e="❤️" type="button">❤️</button><button data-e="👍" type="button">👍</button><button data-e="😂" type="button">😂</button><button data-e="😮" type="button">😮</button><button data-e="😢" type="button">😢</button><button data-e="😡" type="button">😡</button></div>
<div id="modalBack" class="modalback"><div class="modal"><button id="close" class="close" type="button">✕</button><h2>پروفایل من</h2><div id="bigAvatar" class="big"></div><input id="displayName" placeholder="نام نمایشی"><textarea id="bio" rows="3" placeholder="درباره من"></textarea><button id="avatarBtn" class="primary" type="button">📷 عکس پروفایل</button><input id="avatarFile" type="file" accept="image/*" hidden><button id="saveProfile" class="primary" type="button">ذخیره</button><div id="profileError" class="err"></div></div></div>

<script>
const $=id=>document.getElementById(id);
let me="",selected="",selectedUser=null,allUsers=[],socket=null,lastKey="",menuMessage=null,rec=null,chunks=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function avatar(el,url,t){el.style.backgroundImage=url?'url("'+url+'")':"";el.textContent=url?"":(t||"?");}
async function api(url,opt){let r=await fetch(url,opt);if(!r.ok)throw Error();return r.json();}
function start(){ $("auth").style.display="none";$("app").style.display="flex";$("myname").textContent="شما: "+me;connect();refreshUsers();setInterval(refreshUsers,1500);setInterval(()=>{if(selected)loadMessages();},1200);}
function connect(){try{socket=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host);socket.onopen=()=>socket.send(JSON.stringify({type:"auth",username:me}));socket.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.type==="users"){allUsers=d.users||[];renderUsers()}if(d.type==="message"&&selected){lastKey="";loadMessages()}if(d.type==="reaction")updateReaction(d.id,d.reactions)};socket.onclose=()=>setTimeout(()=>{if(me)connect()},2000);}catch{}}
async function refreshUsers(){try{allUsers=await api("/api/users");renderUsers();}catch{}}
function renderUsers(){let q=$("search").value.toLowerCase();$("users").innerHTML="";allUsers.filter(u=>u.username!==me&&(u.username+" "+u.name).toLowerCase().includes(q)).forEach(u=>{let b=document.createElement("button");b.type="button";b.className="user "+(u.username===selected?"sel":"");b.innerHTML='<div class="avatar"></div><div class="info"><div class="name">'+esc(u.name||u.username)+'</div><div class="status '+(u.online?"online":"")+'">'+(u.online?"● آنلاین":"@"+esc(u.username))+'</div></div>';avatar(b.firstChild,u.avatar,(u.name||u.username)[0]);b.onclick=()=>selectUser(u);$("users").appendChild(b);});}
function selectUser(u){selected=u.username;selectedUser=u;$("headName").textContent=u.name||u.username;$("headStatus").textContent=u.online?"آنلاین":"آفلاین";avatar($("headAvatar"),u.avatar,(u.name||u.username)[0]);$("text").disabled=$("send").disabled=$("gallery").disabled=$("voice").disabled=false;$("app").classList.add("open");lastKey="";loadMessages();renderUsers();}
async function loadMessages(){if(!selected)return;try{let a=await api("/api/messages?a="+encodeURIComponent(me)+"&b="+encodeURIComponent(selected));let key=a.map(x=>x.id).join("|");if(key===lastKey)return;lastKey=key;$("messages").innerHTML=a.length?"":'<div class="empty">هنوز پیامی نیست.</div>';a.forEach(draw);$("messages").scrollTop=$("messages").scrollHeight;api("/api/read",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:selected,to:me})}).catch(()=>{});}catch{}}
function reactionHTML(r){if(!r)return"";let a=[];Object.keys(r).forEach(e=>{if(r[e]?.length)a.push("<span>"+e+" "+r[e].length+"</span>")});return a.length?'<div class="reactions">'+a.join("")+"</div>":"";}
function draw(m){let d=document.createElement("div");d.className="bubble "+(m.from===me?"mine":"");d.dataset.id=m.id;d.innerHTML=(m.image?'<img class="photo" src="'+m.image+'">':"")+(m.audio?'<audio class="audio" controls src="'+m.audio+'"></audio>':"")+(m.text?'<div>'+esc(m.text)+'</div>':"")+'<div class="meta">'+new Date(m.time).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})+(m.from===me?(m.read?" ✓✓":" ✓"):"")+"</div>"+reactionHTML(m.reactions);d.oncontextmenu=e=>{e.preventDefault();openMenu(m,e.clientX,e.clientY)};let timer;d.onpointerdown=e=>{if(e.pointerType==="touch")timer=setTimeout(()=>openMenu(m,e.clientX,e.clientY),550)};d.onpointerup=()=>clearTimeout(timer);d.onpointercancel=()=>clearTimeout(timer);$("messages").appendChild(d);}
function openMenu(m,x,y){menuMessage=m;$("menu").style.display="block";$("menu").style.left=Math.max(5,Math.min(x,innerWidth-170))+"px";$("menu").style.top=Math.max(5,Math.min(y,innerHeight-180))+"px";$("reacts").style.display="none";}
function closeMenu(){$("menu").style.display="none";$("reacts").style.display="none";menuMessage=null;}
$("copy").onclick=async()=>{if(menuMessage){try{await navigator.clipboard.writeText(menuMessage.text||"")}catch{}closeMenu()}};
$("forward").onclick=()=>{if(menuMessage){$("text").value=menuMessage.text||"🖼️ عکس";$("text").focus();closeMenu()}};
$("react").onclick=()=>{if(menuMessage){$("menu").style.display="none";$("reacts").style.display="flex";$("reacts").style.left="50%";$("reacts").style.top="45%";}};
$("reacts").querySelectorAll("button").forEach(b=>b.onclick=()=>{if(menuMessage)api("/api/react",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:menuMessage.id,emoji:b.dataset.e,username:me})}).catch(()=>{});closeMenu();});
document.addEventListener("click",e=>{if(!e.target.closest("#menu")&&!e.target.closest("#reacts"))closeMenu();});
function updateReaction(id,r){let d=document.querySelector('[data-id="'+CSS.escape(id)+'"]');if(!d)return;let x=d.querySelector(".reactions");if(x)x.remove();d.insertAdjacentHTML("beforeend",reactionHTML(r));}
async function sendMessage(text="",image="",audio=""){if(!selected)return;try{let d=await api("/api/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:me,to:selected,text,image,audio})});if(d.error)alert(d.error);else{lastKey="";loadMessages();}}catch{alert("سرور قطع است؛ npm start را بررسی کن.");}}
$("send").onclick=()=>{let t=$("text").value.trim();if(t){$("text").value="";sendMessage(t)}};
$("text").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("send").click()}};
$("search").oninput=renderUsers;$("back").onclick=()=>{$("app").classList.remove("open");selected="";};
$("gallery").onclick=()=>$("file").click();
$("file").onchange=()=>{let f=$("file").files[0];if(!f)return;if(f.size>1800000)return alert("عکس کمتر از ۱.۸ مگابایت باشد.");let r=new FileReader();r.onload=()=>sendMessage("",r.result,"");r.readAsDataURL(f);$("file").value="";};
$("voice").onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia)return alert("مرورگر ضبط ویس را پشتیبانی نمی‌کند.");if(rec&&rec.state==="recording"){rec.stop();return}try{let s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());$("voice").classList.remove("recording");let b=new Blob(chunks,{type:"audio/webm"});let r=new FileReader();r.onload=()=>sendMessage("","",r.result);r.readAsDataURL(b)};rec.start();$("voice").classList.add("recording");setTimeout(()=>{if(rec?.state==="recording")rec.stop()},60000)}catch{alert("اجازه میکروفون داده نشد.")}};
$("profileBtn").onclick=async()=>{try{let d=await api("/api/profile?username="+encodeURIComponent(me));$("displayName").value=d.name||me;$("bio").value=d.bio||"";$("avatarFile").dataset.data=d.avatar||"";avatar($("bigAvatar"),d.avatar,(d.name||me)[0]);$("modalBack").style.display="grid"}catch{alert("پروفایل باز نشد.")}};
$("close").onclick=()=>{$("modalBack").style.display="none"};$("avatarBtn").onclick=()=>$("avatarFile").click();
$("avatarFile").onchange=()=>{let f=$("avatarFile").files[0];if(!f)return;if(f.size>1000000){$("profileError").textContent="عکس کمتر از ۱ مگابایت.";return}let r=new FileReader();r.onload=()=>{$("avatarFile").dataset.data=r.result;avatar($("bigAvatar"),r.result,($("displayName").value||me)[0])};r.readAsDataURL(f)};
$("saveProfile").onclick=async()=>{try{let d=await api("/api/profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:me,name:$("displayName").value,bio:$("bio").value,avatar:$("avatarFile").dataset.data||""})});if(d.error)$("profileError").textContent=d.error;else{$("modalBack").style.display="none";refreshUsers()}}catch{$("profileError").textContent="سرور قطع است."}};
$("logout").onclick=()=>{localStorage.removeItem("karen4");location.reload()};
$("login").onclick=()=>{$("login").classList.add("active");$("register").classList.remove("active");$("authBtn").textContent="ورود";$("error").textContent=""};
$("register").onclick=()=>{$("register").classList.add("active");$("login").classList.remove("active");$("authBtn").textContent="ساخت حساب";$("error").textContent=""};
$("authBtn").onclick=async()=>{let reg=$("register").classList.contains("active"),u=$("user").value.trim(),p=$("pass").value;if(!u||!p){$("error").textContent="هر دو فیلد را پر کن.";return}$("authBtn").disabled=true;try{let d=await api(reg?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});if(d.error)$("error").textContent=d.error;else{me=d.username;localStorage.setItem("karen4",me);start()}}catch{$("error").textContent="سرور وصل نیست. اول npm start را اجرا کن."}$("authBtn").disabled=false};
[$("user"),$("pass")].forEach(x=>x.onkeydown=e=>{if(e.key==="Enter")$("authBtn").click()});
let saved=localStorage.getItem("karen4");if(saved){me=saved;start();}
</script></body></html>
